services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cv-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # host.docker.internal only resolves out of the box on Docker
    # Desktop (macOS/Windows); this mapping makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cv-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - cv-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  cv-grafana-data:
